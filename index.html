function choose(){let best=[];for(let tries=0;tries<100;tries++){let picked=[],firsts=new Set(),lasts=new Set();for(let i of shuffle(pages[page].map((_,i)=>i))){let x=pages[page][i];if(firsts.has(x.first)||lasts.has(x.last))continue;picked.push(i);firsts.add(x.first);lasts.add(x.last);if(picked.length===10)break}if(picked.length>best.length)best=picked;if(best.length===10)break}if(best.length<10)throw Error('Not enough distinct word parts on this page');active=best.map(i=>pages[page][i]);answers=Array.from({length:10},()=>({first:'',last:''}))}

function refresh(){document.querySelectorAll('.word').forEach(b=>{let part=b.dataset.part,w=b.dataset.word;b.classList.toggle('used',answers.some(a=>a[part]===w));b.setAttribute('aria-pressed',String(selected?.part===part&&selected?.word===w))});document.querySelectorAll('.slot').forEach(b=>{let i=+b.dataset.slot,part=b.dataset.part,w=answers[i][part],ok=w===active[i][part];b.textContent=w||((part==='first'?'First part':'Ending'));b.draggable=Boolean(w);b.className='slot'+(w?(ok?' good':' bad'):'');$('hint'+i).textContent=answers[i].first&&answers[i].last?(scoreCard(i)?'Correct word!':'Move the red part and try again'):' '});stats()}
function scoreCard(i){return answers[i].first===active[i].first&&answers[i].last===active[i].last}
function place(i,part,w,method){if(!['first','last'].includes(part)||!active.some(x=>x[part]===w))return;let correct=w===active[i][part],repeat=!correct&&events.some(e=>!e.correct&&e.word===w&&e.big===active[i].big&&e.part===part);events.push({number:events.length+1,round,page:page+1,time:new Date().toISOString(),word:w,big:active[i].big,part,correct,repeat,method});let old=answers.findIndex(a=>a[part]===w);if(old>=0)answers[old][part]='';answers[i][part]=w;selected=null;refresh();save()}
function render(){$('pages').innerHTML=pages.map((_,i)=>`<button data-page="${i}" class="${i===page?'active':''}">Page ${i+1}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=+b.dataset.page;round++;choose();render();save()});for(let part of ['first','last']){let words=shuffle(active.map(x=>x[part]));$(part+'Bank').innerHTML=words.map(w=>`<button class="word" draggable="true" data-part="${part}" data-word="${w}" aria-pressed="false">${w}</button>`).join('')}$('grid').innerHTML=active.map((x,i)=>`<div class="card"><div class="picture" role="img" aria-label="Picture of ${x.big}">${x.emoji}</div><div class="parts"><button class="slot" data-slot="${i}" data-part="first" aria-label="First part for picture ${i+1}"></button><span class="join">+</span><button class="slot" data-slot="${i}" data-part="last" aria-label="Ending for picture ${i+1}"></button></div><div id="hint${i}" class="hint"></div></div>`).join('');document.querySelectorAll('.word').forEach(b=>{b.ondragstart=e=>{e.dataTransfer.setData('text/plain',JSON.stringify({part:b.dataset.part,word:b.dataset.word}));e.dataTransfer.effectAllowed='move'};b.onclick=()=>{selected={part:b.dataset.part,word:b.dataset.word};refresh()}});document.querySelectorAll('.slot').forEach(b=>{b.ondragstart=e=>{let part=b.dataset.part,w=answers[+b.dataset.slot][part];if(!w){e.preventDefault();return}e.dataTransfer.setData('text/plain',JSON.stringify({part,word:w}));e.dataTransfer.effectAllowed='move'};b.ondragover=e=>{e.preventDefault();b.classList.add('over')};b.ondragleave=()=>b.classList.remove('over');b.ondrop=e=>{e.preventDefault();b.classList.remove('over');try{let item=JSON.parse(e.dataTransfer.getData('text/plain'));if(item.part===b.dataset.part)place(+b.dataset.slot,item.part,item.word,'drag')}catch(_){}};b.onclick=()=>{let part=b.dataset.part;if(selected?.part===part)place(+b.dataset.slot,part,selected.word,'tap');else if(answers[+b.dataset.slot][part]){selected={part,word:answers[+b.dataset.slot][part]};refresh()}}});refresh()}
$('check').onclick=()=>{stats();alert(score()+' of 10 words complete. Move any red parts and try again.')};$('remix').onclick=()=>{round++;choose();render();save()};$('retry').onclick=()=>{round++;answers=Array.from({length:10},()=>({first:'',last:''}));render();save()};$('print').onclick=()=>window.print();
$('history').onclick=()=>{let body=$('historyBody');body.replaceChildren();let t=document.createElement('table'),row=t.createTHead().insertRow();['#','Round','Page','Part','Choice','Picture word','Result','Repeat'].forEach(v=>{let th=document.createElement('th');th.textContent=v;row.appendChild(th)});let tb=t.createTBody();events.forEach(e=>{let r=tb.insertRow();[e.number,e.round,e.page,e.part,e.word,e.big,e.correct?'Correct':'Error',e.repeat?'Yes':'No'].forEach(v=>r.insertCell().textContent=v)});body.appendChild(t);$('dialog').showModal()};$('close').onclick=()=>$('dialog').close();
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('report').onclick=()=>{let errors=events.filter(e=>!e.correct).length,repeats=events.filter(e=>e.repeat).length;let rows=events.map(e=>`<tr><td>${e.number}</td><td>${e.round}</td><td>${e.page}</td><td>${esc(e.part)}</td><td>${esc(e.word)}</td><td>${esc(e.big)}</td><td>${e.correct?'Correct':'Error'}</td><td>${e.repeat?'Yes':'No'}</td></tr>`).join('');let frame=document.createElement('iframe');frame.style.cssText='position:fixed;left:-10000px;width:800px;height:600px';frame.onload=()=>{frame.contentWindow.focus();frame.contentWindow.print();frame.contentWindow.addEventListener('afterprint',()=>setTimeout(()=>frame.remove(),1000),{once:true})};frame.srcdoc=`<!doctype html><html><head><meta charset="utf-8"><title>Hide and Find Report</title><style>@page{size:letter portrait;margin:15mm}body{font:12px "Century Gothic",Arial,sans-serif;color:#17314c}h1{font-size:25px}table{border-collapse:collapse;width:100%;font-size:10px}th,td{border:1px solid #ccd8e3;padding:6px;text-align:left}thead{display:table-header-group}tr{break-inside:avoid}.picture{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;font-family:"Segoe UI Emoji","Apple Color Emoji",sans-serif;font-size:clamp(60px,8vh,105px);line-height:1;user-select:none}@media print{.picture{font-size:65px}}</style></head><body><h1>Hide and Find Report</h1><h2>Student ID: ${esc(studentId.trim()||'Not entered')}</h2><p>Current page ${page+1}, round ${round}, completed words ${score()}/10</p><p>All placements: ${events.length} · Errors: ${errors} · Repeat errors: ${repeats}</p><p>A repeat error is the same wrong part placed on the same picture again.</p><table><thead><tr><th>#</th><th>Round</th><th>Page</th><th>Part</th><th>Choice</th><th>Picture word</th><th>Result</th><th>Repeat</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;document.body.appendChild(frame)};
render();
</script></html>
